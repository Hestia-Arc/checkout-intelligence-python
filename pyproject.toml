
[project]
name = "checkout-intelligence-python"
version = "0.1.0"
description = "Merchant checkout analytics and intelligence system"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "psycopg[binary]>=3.2,<4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
]

[tool.uv]
package = false
